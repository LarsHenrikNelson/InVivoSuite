[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "invivosuite"
description = "In vivo electrophysiology analysis package for analyzing LFPs and spikes from Kilosort."
readme = "README.md"
authors = [{ name = "Lars Henrik Nelson", email = "larshnelson@protonmail.com" }]
version = "2026.05.05"
keywords = ["electrophysiology", "analysis"]
dependencies = [
    "h5py",
    "joblib",
    "KDEpy",
    "matplotlib",
    "networkx",
    "numba",
    "numpy",
    "pyfcwt>=0.1.1",
    "pyFFTW",
    "PyWavelets",
    "scikit-learn",
    "scipy",
    "Send2Trash",
    "statsmodels",
]
requires-python = ">=3.10"
license = {text = 'GNU General Public License v3 (GPLv3)'}

[project.optional-dependencies]
plotting = [
    "matplotlib",
]

[tool.setuptools.package-data]
invivosuite = ["acq/bin/*.dll"]

[project.urls]
Homepage = "https://github.com/LarsHenrikNelson/InVivoSuite"

[tool.ruff]
# These two legacy modules contain pre-existing syntax errors (they cannot be
# imported at all) and are documented in AGENTS.md; excluded so lint stays
# meaningful for the rest of the package.
extend-exclude = [
    "invivosuite/asymp_pdc/pdc.py",
    "invivosuite/functions/curve_fit.py",
]

[tool.ruff.lint]
# F401/F403 ok (re-export style). F841 (unused locals) is noisy in research code.
ignore = ["F401", "F403", "F841"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.15.12",
]
